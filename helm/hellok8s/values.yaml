replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/hellojamal/yunjitest_cicd/hellok8s
  tag: latest
  # Use Always when tag is "latest" so new images are picked up after CI pushes the same tag.
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  # Optional static NodePort (30000–32767). Omit or set null for auto-assignment.
  nodePort: 30888

# Envoy Gateway (Gateway API): add matching listener on Gateway yunji-gateway first, or use chart + ops runbook.
httproute:
  enabled: true
  hostname: yunjitest-hello.yunjisoft.com
  gatewayName: yunji-gateway
  gatewayNamespace: envoy-gateway-system
  listenerSectionName: yunjitest-hello-http

resources: {}
