replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# Runtime pull: GHCR (nodes trust public TLS). CI also pushes the same image to Harbor (library/hellok8s) for catalog/OCI.
image:
  repository: ghcr.io/hellojamal/yunjitest_cicd/hellok8s
  tag: latest
  pullPolicy: Always

# ClusterIP avoids extra NodePort in shared cicd-system; use HTTPRoute / port-forward for access.
service:
  type: ClusterIP
  port: 80

# Optional: [{ name: harbor-regcred }] if Harbor project requires pull secret.
imagePullSecrets: []

# Envoy Gateway (Gateway API): add matching listener on Gateway yunji-gateway first, or use chart + ops runbook.
httproute:
  enabled: true
  hostname: yunjitest-hello.yunjisoft.com
  gatewayName: yunji-gateway
  gatewayNamespace: envoy-gateway-system
  listenerSectionName: yunjitest-hello-http

resources: {}
