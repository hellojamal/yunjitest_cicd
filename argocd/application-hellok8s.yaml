# GitOps: GitHub → Actions (arc-runners) → Docker image + Helm OCI in Harbor → Argo CD syncs into cicd-system.
# Harbor push defaults ON in CI unless Variable HARBOR_HELM_PUSH_ENABLED=false. See .github/workflows/ci.yml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yunjitest-hellok8s
  namespace: cicd-system
  labels:
    app.kubernetes.io/name: yunjitest-hellok8s
    app.kubernetes.io/part-of: yunjitest-cicd
spec:
  project: default
  source:
    repoURL: oci://192.168.10.121:30003/library/hellok8s
    path: "."
    targetRevision: "*"
    helm:
      releaseName: yunjitest-hello
  destination:
    server: https://kubernetes.default.svc
    namespace: cicd-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
