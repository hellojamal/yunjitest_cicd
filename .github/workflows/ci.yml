# CI/CD (single app namespace target: cicd-system):
# - validate: GitHub-hosted — helm lint / template; PR docker build (no push).
# - ship: self-hosted ARC `arc-runners` (namespace cicd-runner) — build/push image to GHCR + Harbor,
#         optional Helm OCI push + bot commit when HARBOR_HELM_PUSH_ENABLED=true.
# - cicd-system: Argo CD + Harbor + demo Deployment/Service/HTTPRoute (GitOps from Harbor OCI chart).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hellok8s
  HARBOR_DOCKER_REGISTRY: "192.168.10.121:30003"
  HARBOR_IMAGE_REPO: "192.168.10.121:30003/library/hellok8s"

jobs:
  validate:
    name: Helm validate (GitHub-hosted)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm lint
        run: helm lint ./helm/hellok8s

      - name: Helm template (dry-run render)
        run: helm template demo ./helm/hellok8s --set image.tag=ci-${{ github.sha }} > /tmp/rendered.yaml && head -n 40 /tmp/rendered.yaml

      - name: Set up Docker Buildx (PR image smoke build)
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Docker build only (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: hellok8s:pr-${{ github.event.number }}

  ship:
    name: Build & Harbor CD (self-hosted ARC)
    runs-on: arc-runners
    needs: [validate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner smoke (Harbor + GHCR)
        run: |
          set -euo pipefail
          curl -fsSL -m 15 -k "https://${HARBOR_DOCKER_REGISTRY}/api/v2.0/ping" | head -c 120 || true
          echo
          curl -fsSL -m 15 "https://ghcr.io/v2/" | head -c 80 || true
          echo

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Harbor (container registry + Helm OCI)
        if: vars.HARBOR_HELM_PUSH_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_DOCKER_REGISTRY }}
          username: ${{ secrets.HARBOR_OCI_USERNAME }}
          password: ${{ secrets.HARBOR_OCI_PASSWORD }}

      - name: Build and push image (GHCR + Harbor)
        if: vars.HARBOR_HELM_PUSH_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.HARBOR_IMAGE_REPO }}:latest
            ${{ env.HARBOR_IMAGE_REPO }}:${{ github.sha }}

      - name: Build and push image (GHCR only)
        if: vars.HARBOR_HELM_PUSH_ENABLED != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install yq (Helm GitOps)
        if: vars.HARBOR_HELM_PUSH_ENABLED == 'true'
        run: |
          set -euo pipefail
          YQ_VER=v4.44.3
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64" -o /tmp/yq
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq

      - name: Bump Helm image tag + chart patch (keep GHCR repo for kubelet TLS)
        if: vars.HARBOR_HELM_PUSH_ENABLED == 'true'
        run: |
          set -euo pipefail
          yq -i '.image.tag = strenv(TAG)' helm/hellok8s/values.yaml
          v=$(grep '^version:' helm/hellok8s/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
          IFS=. read -r major minor patch <<<"$v"
          patch=$((patch + 1))
          sed -i "s/^version:.*/version: ${major}.${minor}.${patch}/" helm/hellok8s/Chart.yaml
        env:
          TAG: ${{ github.sha }}

      - name: Helm package
        if: vars.HARBOR_HELM_PUSH_ENABLED == 'true'
        run: |
          set -euo pipefail
          helm package ./helm/hellok8s --destination /tmp

      - name: Helm OCI push to Harbor
        if: vars.HARBOR_HELM_PUSH_ENABLED == 'true'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_OCI_REGISTRY }}
          HARBOR_USER: ${{ secrets.HARBOR_OCI_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_OCI_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HARBOR_HOST:-}" ] || [ -z "${HARBOR_PASS:-}" ]; then
            echo "::error::Set secrets HARBOR_OCI_REGISTRY, HARBOR_OCI_USERNAME, HARBOR_OCI_PASSWORD when HARBOR_HELM_PUSH_ENABLED is true."
            exit 1
          fi
          VER=$(grep '^version:' helm/hellok8s/Chart.yaml | awk '{print $2}')
          TGZ="/tmp/hellok8s-${VER}.tgz"
          test -f "$TGZ"
          echo "$HARBOR_PASS" | helm registry login "$HARBOR_HOST" -u "${HARBOR_USER:-admin}" --password-stdin --insecure
          helm push "$TGZ" "oci://${HARBOR_HOST}/library" --insecure-skip-tls-verify

      - name: Commit Helm chart + values for GitOps traceability
        if: vars.HARBOR_HELM_PUSH_ENABLED == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/hellok8s/values.yaml helm/hellok8s/Chart.yaml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(gitops): image ${TAG}, chart bump for Argo/Harbor [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
