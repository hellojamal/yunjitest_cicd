# Buildx driver=kubernetes 在命名空间 cicd-system 内创建 BuildKit（Deployment/StatefulSet 等）。
# 将 YOUR_RUNNER_SA 改为 ARC runner Pod 实际使用的 ServiceAccount 名称。
# 若该 SA 不在 cicd-system（例如 runner 在 cicd-runner），请把 RoleBinding.subjects[0].namespace 改为 SA 所在命名空间。
# 然后：kubectl apply -f arc-buildx-kubernetes-rbac.yaml
#
# 查 SA：kubectl -n cicd-runner get pod -l app.kubernetes.io/name=gha-runner-scale-set -o jsonpath='{.items[0].spec.serviceAccountName}{"\n"}'

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-buildx-kubernetes-driver
  namespace: cicd-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "secrets", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-buildx-kubernetes-driver
  namespace: cicd-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gha-buildx-kubernetes-driver
subjects:
  - kind: ServiceAccount
    name: YOUR_RUNNER_SA
    namespace: cicd-runner
