# GitOps: GitHub (source) → Actions builds image + pushes Helm OCI to Harbor → Argo CD pulls chart here.
# Argo cannot reach GitHub from this cluster; chart is published to Harbor by CI.
# Set repository Variable HARBOR_HELM_PUSH_ENABLED=true and Secrets (see .github/workflows/ci.yml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yunjitest-hellok8s
  namespace: cicd-system
  labels:
    app.kubernetes.io/name: yunjitest-hellok8s
    app.kubernetes.io/part-of: yunjitest-cicd
spec:
  project: default
  source:
    repoURL: oci://192.168.10.121:30003/library/hellok8s
    path: "."
    targetRevision: "*"
    helm:
      releaseName: yunjitest-hello
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-k8s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
